{% extends 'layout.html' %}
{% block title %} Formularios en Django {% endblock %}
{% block content %}
<h1 class="title">Formularios en Django</h1>

<form action="" method="POST">
    {% csrf_token %}
    
    <!-- aqui mostramos el Formularios mandando a llamar la variable form que se creo en la vista -->
    {{ form.as_p }} <!-- Muestra el formulario como párrafos -->

    <!-- Botón -->
    <input type="submit" value="Guardar" />
</form>
{% endblock %}
